name: Check
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings:
    name: Settings migration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: Makefile
      - name: Run tests
        run: make test

  prek:
    name: Prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nixfmt
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install nixfmt
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - uses: j178/prek-action@v3.0.1
        with:
          extra-args: --all-files

  lockfile:
    name: Validate lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate flake.lock
        run: |
          test -f flake.lock
          nix flake metadata --no-update-lock-file

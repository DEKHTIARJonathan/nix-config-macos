name: Check
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings:
    name: Settings migration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test without accessing macOS preferences
        run: |
          python3 -m venv /tmp/mac-config-tests
          /tmp/mac-config-tests/bin/pip install json5==0.13.0
          /tmp/mac-config-tests/bin/python -B -m unittest discover -s tests -v

  prek:
    name: Prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nixfmt
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install nixfmt
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - uses: j178/prek-action@v3.0.0
        with:
          extra-args: --all-files

  lockfile:
    name: Validate lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate flake.lock
        run: |
          test -f flake.lock
          nix flake metadata --no-update-lock-file
